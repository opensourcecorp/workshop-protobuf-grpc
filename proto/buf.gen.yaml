version: v2
plugins:
  - local: protoc-gen-go
    out: ../generated/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../generated/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - local: protoc-gen-grpc-gateway
    out: ../generated/go
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
      - allow_delete_body=true
  - local: protoc-gen-openapiv2
    out: ../generated/openapi
  - remote: buf.build/protocolbuffers/python:v30.1
    out: ../generated/python
  - remote: buf.build/protocolbuffers/pyi:v30.1
    out: ../generated/python
  - remote: buf.build/grpc/python:v1.71.0
    out: ../generated/python
    # opt:
    #   - require_unimplemented_servers=false
  - local: ../protoc-gen-bash/build/protoc-gen-bash
    out: ../generated/bash
    opt:
      - paths=source_relative
  - local: ../protoc-gen-bash/v2/build/protoc-gen-bash
    out: ../generated/bash
    opt:
      - paths=source_relative
